version: 20
services:
- name: postgres
  image: postgres:15
  envVars:
  - name: POSTGRES_PASSWORD
    value: postgres
  readinessCheckCommand: exec pg_isready -h 127.0.0.1 -p 5432
jobs:
- name: Build
  jobExecutor: onedev-executor-1
  steps:
  - !CheckoutStep
    name: Checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: Build
    runInContainer: true
    image: mcr.microsoft.com/dotnet/sdk:latest
    interpreter: !DefaultInterpreter
      commands:
      - dotnet nuget locals all -l
      - echo "{}" > TimeTracker.Tests.Integration.Api/appsettings.Local.json
      - echo "{}" > TimeTracker.Migrations/appsettings.Local.json
      - echo "{}" > TimeTracker.Tests.Integration.Business/appsettings.Local.json
      - echo "{}" > TimeTracker.Tests.Integration.Api/appsettings.Local.json
      - echo "{}" > TimeTracker.WorkerServices/appsettings.Local.json
      - ''
      - '# Tests'
      - dotnet build --configuration=Debug --output="./build/TimeTracker.Tests.Unit.Business"
        ./TimeTracker.Tests.Unit.Business
      - dotnet build --configuration=Debug --output="./build/TimeTracker.Tests.Integration.Business"
        ./TimeTracker.Tests.Integration.Business
      - dotnet build --configuration=Debug --output="./build/TimeTracker.Tests.Integration.Api"
        ./TimeTracker.Tests.Integration.Api
      - ''
      - '# Main projects '
      - dotnet build --configuration=Release --self-contained=false --runtime=linux-x64
        --output="./build/TimeTracker.Api" ./TimeTracker.Api
      - dotnet build --configuration=Release --self-contained=false --runtime=linux-x64
        --output="./build/TimeTracker.Migrations" ./TimeTracker.Migrations
      - dotnet build --configuration=Release --self-contained=false --runtime=linux-x64
        --output="./build/TimeTracker.WorkerServices" ./TimeTracker.WorkerServices
      - ''
      - '# Web project'
      - dotnet build --configuration=Production -f net7.0 -r linux-x64 --self-contained
        true --output="./build/TimeTracker.Web" ./TimeTracker.Web
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !PublishArtifactStep
    name: Publish artifacts
    artifacts: '*/**'
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  paramSpecs:
  - !TextParam
    name: db
    allowEmpty: false
    multiline: false
    defaultValueProvider: !SpecifiedDefaultValue
      value: Some value
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  caches:
  - key: nuget-cache
    path: /root/.nuget/packages/
  timeout: 3600
- name: Run Integration Tests
  jobExecutor: onedev-executor-1
  steps:
  - !CommandStep
    name: Run migrations
    runInContainer: true
    image: mcr.microsoft.com/dotnet/sdk
    interpreter: !DefaultInterpreter
      commands:
      - export ConnectionStrings__DefaultConnection="User ID=postgres;Password=postgres;Host=postgres;Port=5432;Database=postgres;Pooling=true;Include
        Error Detail=true;Log Parameters=true;"
      - export Hibernate__IsShowSql="false"
      - ''
      - ./build/TimeTracker.Migrations/TimeTracker.Migrations
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: Run Tests
    runInContainer: true
    image: mcr.microsoft.com/dotnet/sdk
    interpreter: !DefaultInterpreter
      commands:
      - export ConnectionStrings__DefaultConnection="User ID=postgres;Password=postgres;Host=postgres;Port=5432;Database=postgres;Pooling=true;Include
        Error Detail=true;Log Parameters=true;"
      - export Hibernate__IsShowSql="false"
      - export Integration__ClickUp__SecurityKey="@secret:dev-integration-clickup-security-key@"
      - export Integration__Redmine__ApiKey="@secret:dev-integration-redmine-api-key@"
      - export Integration__Redmine__Url="@secret:dev-integration-redmine-url@"
      - export AWS__S3__AccessKey="@secret:dev-aws-s3-access-key@"
      - export AWS__S3__SecretKey="@secret:dev-aws-s3-secret-key@"
      - export AWS__S3__BucketName="@secret:dev-aws-s3-bucket-name@"
      - ''
      - dotnet test --logger trx --verbosity=minimal --results-directory /tmp/test
        ./TimeTracker.Tests.Unit.Business
      - ''
      - dotnet test --logger trx --verbosity=minimal --results-directory /tmp/test
        ./TimeTracker.Tests.Integration.Business
      - ''
      - dotnet test --logger trx --verbosity=minimal --results-directory /tmp/test
        ./TimeTracker.Tests.Integration.Api
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  paramSpecs:
  - !TextParam
    name: db
    allowEmpty: false
    multiline: false
    defaultValueProvider: !SpecifiedDefaultValue
      value: Some value
  triggers:
  - !PullRequestUpdateTrigger
    projects: TimeVic/Main
    params:
    - name: db
      valuesProvider: !Ignore {}
      secret: false
  jobDependencies:
  - jobName: Build
    requireSuccessful: true
    jobParams:
    - name: db
      valuesProvider: !SpecifiedValues
        values:
        - - Some value 2
      secret: false
    artifacts: '*/**'
  requiredServices:
  - postgres
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Publish
  jobExecutor: onedev-executor-1
  steps:
  - !CommandStep
    name: Build and push main docker image
    runInContainer: true
    image: docker
    interpreter: !DefaultInterpreter
      commands:
      - image="lampego/timevic-main"
      - imageVersion="@build_number@"
      - imageName="$image:$imageVersion"
      - ''
      - docker build --file="devops/onedev/common/Dockerfile" -t $imageName .
      - docker login -u "@secret:dockerhub-login@" -p "@secret:dockerhub-password@"
      - docker push $imageName
      - docker tag $imageName lampego/timevic-main:latest
      - docker push lampego/timevic-main:latest
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: Build and push web docker image
    runInContainer: true
    image: docker
    interpreter: !DefaultInterpreter
      commands:
      - image="lampego/timevic-web"
      - imageVersion="@build_number@"
      - imageName="$image:$imageVersion"
      - ''
      - docker build --file="devops/onedev/web/Dockerfile" -t $imageName .
      - docker login -u "@secret:dockerhub-login@" -p "@secret:dockerhub-password@"
      - docker push $imageName
      - docker tag $imageName lampego/timevic-web:latest
      - docker push lampego/timevic-web:latest
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  jobDependencies:
  - jobName: Build
    requireSuccessful: true
    jobParams:
    - name: db
      valuesProvider: !SpecifiedValues
        values:
        - - Some value
      secret: false
    artifacts: '*/**'
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Deploy
  jobExecutor: abedor-web-1
  steps:
  - !RunContainerStep
    name: Run migrations
    image: lampego/timevic-main
    args: --restart=no
    envVars:
    - name: PROJECT_DIR
      value: TimeTracker.Migrations
    - name: Serilog__MinimumLevel__Default
      value: Debug
    - name: ConnectionStrings__DefaultConnection
      value: User ID=@secret:dockerhub-login@;Password=@secret:dockerhub-password@;Host=192.168.99.8;Port=5433;Database=timevic;Pooling=true;
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !RunContainerStep
    name: Run Main API container
    image: lampego/timevic-main
    args: -p 6210:80 --restart=always -d
    envVars:
    - name: PROJECT_DIR
      value: TimeTracker.Api
    - name: App__FrontendUrl
      value: https://timevic.com
    - name: Serilog__IsSendEmailIfError
      value: 'false'
    - name: Serilog__MinimumLevel__Default
      value: Debug
    - name: Redis__Server
      value: 10.10.0.2:6379
    - name: ConnectionStrings__DefaultConnection
      value: User ID=@secret:dockerhub-login@;Password=@secret:dockerhub-password@;Host=192.168.99.8;Port=5433;Database=timevic;Pooling=true;
    - name: Smtp__UserName
      value: '@secret:prod-smtp-login@'
    - name: Smtp__Password
      value: '@secret:prod-smtp-password@'
    - name: App__Auth__SymmetricSecurityKey
      value: '@secret:prod-auth-symmetric-security-key@'
    - name: ReCaptcha__Secret
      value: '@secret:prod-recaptcha-secret@'
    - name: AWS__S3__AccessKey
      value: '@secret:prod-s3-access-key@'
    - name: AWS__S3__SecretKey
      value: '@secret:prod-s3-secret-key@'
    - name: AWS__S3__BucketName
      value: '@secret:prod-s3-bucket-name@'
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !RunContainerStep
    name: Run Worker Services container
    image: lampego/timevic-main
    args: --restart=always -d
    envVars:
    - name: PROJECT_DIR
      value: TimeTracker.WorkerServices
    - name: App__FrontendUrl
      value: https://timevic.com
    - name: Serilog__IsSendEmailIfError
      value: 'false'
    - name: Serilog__MinimumLevel__Default
      value: Debug
    - name: Redis__Server
      value: 10.10.0.2:6379
    - name: ConnectionStrings__DefaultConnection
      value: User ID=@secret:dockerhub-login@;Password=@secret:dockerhub-password@;Host=192.168.99.8;Port=5433;Database=timevic;Pooling=true;
    - name: Smtp__UserName
      value: '@secret:prod-smtp-login@'
    - name: Smtp__Password
      value: '@secret:prod-smtp-password@'
    - name: App__Auth__SymmetricSecurityKey
      value: '@secret:prod-auth-symmetric-security-key@'
    - name: ReCaptcha__Secret
      value: '@secret:prod-recaptcha-secret@'
    - name: AWS__S3__AccessKey
      value: '@secret:prod-s3-access-key@'
    - name: AWS__S3__SecretKey
      value: '@secret:prod-s3-secret-key@'
    - name: AWS__S3__BucketName
      value: '@secret:prod-s3-bucket-name@'
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !RunContainerStep
    name: Run Web container
    image: lampego/timevic-web
    args: -d --restart=always -p 6211:80
    useTTY: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  jobDependencies:
  - jobName: Publish
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
