<!-- <subject>Time entries returned for rework</subject> -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="width:100%;border-collapse:collapse;">
    <tr><td style="padding:0 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:32px;font-weight:700;color:#0f172a;">Time entries returned for rework</td></tr>
    <tr><td style="padding:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#334155;">Hello!</td></tr>
    <tr><td style="padding:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#334155;">Your manager has reviewed your submitted time entries in workspace <strong>{workspaceName}</strong> and returned them for rework.</td></tr>
    <tr>
        <td style="padding:0 0 16px;">
            <div style="background-color:#fef3c7;border-left:4px solid:#f59e0b;padding:12px 16px;border-radius:4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#92400e;">
                <strong>Manager comment:</strong><br/>
                {rejectionReason}
            </div>
        </td>
    </tr>
    <tr><td style="padding:0 0 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#334155;">Please review the entries, make the necessary corrections, and resubmit them for approval.</td></tr>
    <tr><td><a href="{host}{timeEntriesUrl}" style="display:inline-block;border-radius:8px;background-color:#2563eb;padding:12px 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;">View Time Entries</a></td></tr>
</table>
